name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful master-push CI run containing the sealed Linux package
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: >-
      github.ref == 'refs/heads/master' && vars.LINUX_PRODUCTION_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      AZURE_WEBAPP_NAME: rollandpaint-prod-ca
      PRODUCTION_HEALTH_URL: https://rollandpaint.com/healthz/ready
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Resolve successful release and pinned rollback
        id: release
        env:
          SELECTED_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_run_id || github.event.workflow_run.id }}
        run: python tools/cloud/resolve_release_run.py
      - name: Download sealed release
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.release.outputs.run_id }}
          name: migration-${{ steps.release.outputs.commit }}-linux-x64
          path: artifacts/release
      - name: Download sealed rollback before changing production
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.release.outputs.rollback_run }}
          name: migration-${{ steps.release.outputs.rollback_commit }}-linux-x64
          path: artifacts/rollback
      - name: Verify both immutable packages
        id: packages
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_RUN: ${{ steps.release.outputs.run_id }}
          ROLLBACK_COMMIT: ${{ steps.release.outputs.rollback_commit }}
          ROLLBACK_RUN: ${{ steps.release.outputs.rollback_run }}
          ROLLBACK_SHA: ${{ steps.release.outputs.rollback_sha }}
        run: |
          set -euo pipefail
          digest=$(python tools/cloud/verify_release_package.py artifacts/release --commit "$RELEASE_COMMIT" --run-id "$RELEASE_RUN")
          python tools/cloud/verify_release_package.py artifacts/rollback --commit "$ROLLBACK_COMMIT" --run-id "$ROLLBACK_RUN" --sha256 "$ROLLBACK_SHA"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - uses: azure/login@8c334a195cbb38e46038007b304988d888bf676a # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Schema changes require their own reviewed release. This hosting pipeline
      # never applies EF migrations and never rebuilds rollback code.
      - name: Deploy verified Linux package
        id: deploy
        continue-on-error: true
        run: az webapp deploy --resource-group mphp-rg --name "$AZURE_WEBAPP_NAME" --src-path artifacts/release/minipainterhub-linux-x64.zip --type zip --clean true --only-show-errors
      - name: Verify production readiness
        id: healthy
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: |
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --max-time 20 "$PRODUCTION_HEALTH_URL"; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Restore the pinned Linux package on deployment or health failure
        if: steps.deploy.outcome != 'success' || steps.healthy.outcome != 'success'
        run: |
          az webapp deploy --resource-group mphp-rg --name "$AZURE_WEBAPP_NAME" --src-path artifacts/rollback/minipainterhub-linux-x64.zip --type zip --clean true --only-show-errors
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --max-time 20 "$PRODUCTION_HEALTH_URL"; then
              echo "::error::Deployment failed; restored the pinned previous Linux release."
              exit 1
            fi
            sleep 10
          done
          echo "::error::Deployment and rollback readiness failed; operator intervention is required."
          exit 1
      - name: Record the successful immutable release
        if: steps.healthy.outcome == 'success'
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_RUN: ${{ steps.release.outputs.run_id }}
          RELEASE_SHA: ${{ steps.packages.outputs.sha256 }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          pathlib.Path('release-record.json').write_text(json.dumps({'commit':os.environ['RELEASE_COMMIT'],'ciRunId':os.environ['RELEASE_RUN'],'sha256':os.environ['RELEASE_SHA']}))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --force --annotate production-last-good "$RELEASE_COMMIT" --file release-record.json
          git push --force origin refs/tags/production-last-good
