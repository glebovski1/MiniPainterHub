name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
  release:
    types:
      - published

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check documentation references
        run: python tools/docs/check-doc-references.py --repo .

      - name: Verify migration packaging guards
        run: python tools/cloud/test_package_migration.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore MiniPainterHub.sln

      - name: Validate appsettings JSON
        shell: pwsh
        run: |
          $jsonFiles = Get-ChildItem -Path . -Recurse -Filter 'appsettings*.json' |
            Where-Object { $_.FullName -notmatch '[\\/](bin|obj|output|artifacts|test-results|tmp|node_modules)[\\/]' }
          $failed = $false
          foreach ($file in $jsonFiles) {
            try {
              Get-Content -Raw -LiteralPath $file.FullName | ConvertFrom-Json | Out-Null
            }
            catch {
              Write-Error "Invalid JSON in $($file.FullName): $($_.Exception.Message)"
              $failed = $true
            }
          }
          if ($failed) {
            exit 1
          }

      - name: Check NuGet vulnerabilities
        shell: pwsh
        run: |
          $output = dotnet list MiniPainterHub.sln package --vulnerable --include-transitive 2>&1
          $output | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($output -match 'has the following vulnerable packages') {
            throw "NuGet vulnerability scan reported vulnerable packages."
          }

      - name: Verify formatting
        run: dotnet format MiniPainterHub.sln --verify-no-changes --verbosity minimal --no-restore

      - name: Build
        run: dotnet build MiniPainterHub.sln --configuration Release --no-restore /warnaserror

      - name: Test server (SQL cases have a separate required job)
        run: dotnet test MiniPainterHub.Server.Tests/MiniPainterHub.Server.Tests.csproj --configuration Release --no-build --filter 'Category!=SqlServer' --logger "trx;LogFileName=server-tests.trx" --collect:"XPlat Code Coverage" --results-directory artifacts/test-results

      - name: Test WebApp components
        run: dotnet test MiniPainterHub.WebApp.Tests/MiniPainterHub.WebApp.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=webapp-tests.trx" --collect:"XPlat Code Coverage" --results-directory artifacts/test-results

      - name: Detect test file changes for anti-flake rerun
        if: github.event_name == 'pull_request'
        id: test_changes
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only '${{ github.event.pull_request.base.sha }}' '${{ github.sha }}')"
          if echo "$changed_files" | grep -Eq '^(MiniPainterHub\.Server\.Tests/|MiniPainterHub\.WebApp\.Tests/|e2e/tests/)'; then
            echo "tests_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "tests_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Anti-flake rerun server tests
        if: github.event_name == 'pull_request' && steps.test_changes.outputs.tests_changed == 'true'
        run: dotnet test MiniPainterHub.Server.Tests/MiniPainterHub.Server.Tests.csproj --configuration Release --no-build --filter 'Category!=SqlServer' --logger "trx;LogFileName=server-tests-rerun.trx" --results-directory artifacts/test-results

      - name: Anti-flake rerun WebApp tests
        if: github.event_name == 'pull_request' && steps.test_changes.outputs.tests_changed == 'true'
        run: dotnet test MiniPainterHub.WebApp.Tests/MiniPainterHub.WebApp.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=webapp-tests-rerun.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: artifacts/test-results
          retention-days: 7

  relational-tests:
    name: Linux SQL Server migration and constraint tests
    runs-on: ubuntu-24.04
    needs: build-test
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest@sha256:245f6b1c8903edae52cb20fa31419cefcde1a49938bb8c3447099011fc871ca3
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_COLLATION: SQL_Latin1_General_CP1_CI_AS
          # Disposable loopback-only CI service; never a production credential.
          MSSQL_SA_PASSWORD: LinuxCi_TestOnly_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LinuxCi_TestOnly_2026!' -C -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 12 --health-start-period 30s
    env:
      MPH_TEST_SQL_CONNECTION_STRING: Server=tcp:127.0.0.1,1433;User ID=sa;Password=LinuxCi_TestOnly_2026!;Encrypt=True;TrustServerCertificate=True
      MPH_TEST_SQL_EXPECTED_COMPATIBILITY_LEVEL: '170'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore and build
        run: dotnet build MiniPainterHub.sln --configuration Release /warnaserror
      - name: Execute real SQL tests
        run: dotnet test MiniPainterHub.Server.Tests/MiniPainterHub.Server.Tests.csproj --configuration Release --no-build --filter 'Category=SqlServer' --logger "trx;LogFileName=sql-tests.trx" --results-directory artifacts/sql-tests
      - name: Verify actual SQL execution (no skipped success)
        run: python tools/cloud/check_sql_test_results.py artifacts/sql-tests/sql-tests.trx
      - name: Upload SQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-sql-test-results
          path: artifacts/sql-tests
          retention-days: 7

  browser-smoke:
    name: ui-smoke
    runs-on: ubuntu-24.04
    needs: build-test
    if: github.event_name == 'pull_request'
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest@sha256:245f6b1c8903edae52cb20fa31419cefcde1a49938bb8c3447099011fc871ca3
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_COLLATION: SQL_Latin1_General_CP1_CI_AS
          # Disposable loopback-only CI service; never a production credential.
          MSSQL_SA_PASSWORD: LinuxCi_TestOnly_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LinuxCi_TestOnly_2026!' -C -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 12 --health-start-period 30s
    env:
      E2E_CONNECTION_STRING: Server=tcp:127.0.0.1,1433;Database=MiniPainterHub_E2E_CI;User ID=sa;Password=LinuxCi_TestOnly_2026!;Encrypt=True;TrustServerCertificate=True
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Restore .NET packages
        run: dotnet restore MiniPainterHub.sln

      - name: Install npm dependencies
        working-directory: e2e
        run: npm ci

      - name: Check browser harness platform selection
        working-directory: e2e
        run: npm run test:harness

      - name: Audit npm dependencies
        working-directory: e2e
        run: npm audit --audit-level=moderate

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        working-directory: e2e
        env:
          CI: true
        run: npm run test:smoke

      - name: Resolve UI review scope
        if: github.event_name == 'pull_request'
        id: ui_review_scope
        working-directory: e2e
        shell: bash
        run: |
          set -euo pipefail
          npm run ui-review:scope -- --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}" --output .ui-review-scope.json > /dev/null
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const scopePath = path.resolve("..", ".ui-review-scope.json");
          const scope = JSON.parse(fs.readFileSync(scopePath, "utf8"));
          const command = scope.scope === "full" ? "test:ui-review:full" : "test:ui-review";
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `scope=${scope.scope}\ncommand=${command}\n`);
          NODE

      - name: Run Playwright UI review
        if: steps.ui_review_scope.outputs.scope != 'none'
        working-directory: e2e
        env:
          CI: true
          UI_REVIEW_SCOPE_FILE: ${{ github.workspace }}/.ui-review-scope.json
        run: npm run ${{ steps.ui_review_scope.outputs.command }}

      - name: Assert UI review artifacts exist
        if: steps.ui_review_scope.outputs.scope != 'none'
        shell: bash
        run: |
          set -euo pipefail
          test -f output/playwright/ui-review/manifest.json
          test -f output/playwright/ui-review/report.md

      - name: Upload UI review artifacts
        if: always() && steps.ui_review_scope.outputs.scope != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-review-pr-artifacts
          path: output/playwright/ui-review
          retention-days: 7

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-pr-failure-artifacts
          path: |
            e2e/playwright-report
            e2e/test-results
            output/playwright/ui-review
          retention-days: 7

  hard-tests:
    name: Hard Tests (master/main push + release publish)
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Restore .NET packages
        run: dotnet restore MiniPainterHub.sln

      - name: Build with warnings as errors
        run: dotnet build MiniPainterHub.sln --configuration Release --no-restore /warnaserror

      - name: Run server tests with coverage (hard gate)
        run: dotnet test MiniPainterHub.Server.Tests/MiniPainterHub.Server.Tests.csproj --configuration Release --no-build --filter 'Category!=SqlServer' --logger "trx;LogFileName=server-tests-hard.trx" --collect:"XPlat Code Coverage" --results-directory artifacts/test-results

      - name: Install npm dependencies
        working-directory: e2e
        run: npm ci

      - name: Check browser harness platform selection
        working-directory: e2e
        run: npm run test:harness

      - name: Audit npm dependencies
        working-directory: e2e
        run: npm audit --audit-level=moderate

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        working-directory: e2e
        env:
          CI: true
        run: npm run test:smoke

      - name: Run load smoke gate
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5177
          MPH_LOAD_BASE_URL: http://127.0.0.1:5177
          MPH_LOAD_PROFILE: smoke
        run: |
          set -euo pipefail

          mkdir -p artifacts/load-tests
          dotnet run --project MiniPainterHub.Server/MiniPainterHub.Server.csproj --configuration Release --no-build --no-launch-profile > artifacts/load-tests/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..45}; do
            status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "$MPH_LOAD_BASE_URL/healthz/ready" || true)"
            if [ "$status" = "200" ]; then
              break
            fi

            if [ "$attempt" = "45" ]; then
              echo "::error title=Load smoke server did not become ready::Last readiness status was HTTP $status."
              cat artifacts/load-tests/server.log
              exit 1
            fi

            sleep 2
          done

          dotnet run --project MiniPainterHub.LoadTests/MiniPainterHub.LoadTests.csproj --configuration Release --no-build -- --profile smoke --base-url "$MPH_LOAD_BASE_URL"

      - name: Enforce MiniPainterHub.Server coverage baseline (80%)
        shell: pwsh
        run: ./tools/coverage/check-server-coverage.ps1 -CoverageRoot artifacts/test-results -AssemblyName MiniPainterHub.Server -Threshold 80

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-failure-artifacts
          path: |
            e2e/playwright-report
            e2e/test-results
            artifacts/load-tests
          retention-days: 7

  migration-artifacts:
    name: Seal migration package (${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    needs: [build-test, relational-tests, browser-smoke, hard-tests]
    if: >-
      always() && !cancelled() &&
      needs.build-test.result == 'success' &&
      needs.relational-tests.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      (needs.browser-smoke.result == 'success' || needs.hard-tests.result == 'success')
    strategy:
      matrix:
        runtime: [linux-x64, win-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish the tested revision
        run: dotnet publish MiniPainterHub.Server/MiniPainterHub.Server.csproj --configuration Release --runtime ${{ matrix.runtime }} --self-contained false -p:UseAppHost=false --output artifacts/migration/publish /warnaserror
      - name: Seal package, file hashes and migration inventory
        run: python tools/cloud/package_migration.py --publish artifacts/migration/publish --output artifacts/migration/sealed --runtime ${{ matrix.runtime }}
      - uses: actions/upload-artifact@v4
        with:
          name: migration-${{ github.sha }}-${{ matrix.runtime }}
          path: artifacts/migration/sealed
          if-no-files-found: error
          retention-days: 30
